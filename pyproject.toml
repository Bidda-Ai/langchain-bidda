[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-bidda"
version = "0.1.0"
description = "An integration package connecting Bidda source-verified compliance intelligence to LangChain"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bidda Intelligence PTY LTD", email = "info@bidda.com" }]
keywords = [
    "langchain",
    "compliance",
    "regulatory",
    "regtech",
    "GDPR",
    "EU AI Act",
    "AI safety",
    "legal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain-core>=0.3.15",
    "bidda-shield>=0.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "langchain-tests>=0.3.5",
]

[project.urls]
Homepage = "https://bidda.com"
Repository = "https://github.com/Bidda-Ai/langchain-bidda"
"Source Code" = "https://github.com/Bidda-Ai/langchain-bidda"
"Developer Docs" = "https://bidda.com/developers"
"Bug Tracker" = "https://github.com/Bidda-Ai/langchain-bidda/issues"

[tool.setuptools.packages.find]
include = ["langchain_bidda*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
